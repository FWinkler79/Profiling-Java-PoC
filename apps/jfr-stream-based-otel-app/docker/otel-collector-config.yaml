receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Add resource attributes for better identification
  resource:
    attributes:
      - key: service.namespace
        value: jfr-profiling
        action: upsert

exporters:
  # Console exporter - outputs to stdout for inspection
  logging:
    verbosity: detailed
    sampling_initial: 100
    sampling_thereafter: 100

  # Debug exporter - even more detailed output
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging, debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888
