receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Add resource attributes for better identification
  resource:
    attributes:
      - key: service.namespace
        value: jfr-profiling
        action: upsert

exporters:
  # Debug exporter - outputs to stdout for inspection (replaces deprecated logging exporter)
  debug:
    verbosity: detailed

  # OTLP exporter - sends data to SAP Cloud Logging (mTLS / client-certificate auth)
  otlp/sap-cloud-logging:
    endpoint: ingest-otlp-sf-d3d2b4b8-4f24-4d0c-acc3-749707ab1e15.cls-09.cloud.logs.services.sap.hana.ondemand.com:443
    tls:
      insecure: false
      cert_file: /etc/otel/certs/ingest-client.crt
      key_file: /etc/otel/certs/ingest-client.key

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlp/sap-cloud-logging]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
