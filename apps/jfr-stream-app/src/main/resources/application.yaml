server:
  port: 8081

spring:
  application:
    name: JFR Stream Application

# JFR Export Configuration
jfr:
  export:
    # Directory where JFR files will be exported
    directory: ./jfr-exports
    # How often to export JFR snapshots (in seconds)
    interval:
      seconds: 15
  recording:
    # Maximum age of events to keep in the recording buffer (in seconds)
    max-age:
      seconds: 15

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.jfrstream: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
