server:
  port: 8082

spring:
  application:
    name: JFR File Upload Stream Application

# OTLP Configuration
jfr:
  # OpenTelemetry Collector endpoint (gRPC)
  # For Docker: http://localhost:4317
  # For local testing without Docker: http://localhost:4317
  otlp:
    endpoint: http://localhost:4317

  # JFR Export Configuration
  export:
    # How often to export JFR snapshots to OTLP (in seconds)
    interval:
      seconds: 15

  recording:
    # Maximum age of events to keep in the recording buffer (in seconds)
    max-age:
      seconds: 15

  # Instrumentation Scope Configuration
  instrumentation:
    scope:
      name: jfr-file-upload-stream-app
      version: 1.0.0

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.jfruploadstream: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
